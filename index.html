<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Fragancias - Lo Más Vendido</title>
    <style>
        /* Estilos generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #111;
        }

        header {
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
            padding: 20px;
            text-align: center;
        }

        /* 1. Estilos de la Barra de Búsqueda */
        .search-container {
            display: flex;
            justify-content: center;
            padding: 10px 20px;
            background-color: #fff;
        }

        .search-form {
            display: flex;
            width: 100%;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 30px 0 0 30px;
            outline: none;
            font-size: 15px;
            background-color: #f4f4f4;
            transition: background-color 0.2s;
        }

        .search-input:focus {
            background-color: #fff;
            border-color: #000;
        }

        .search-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 0 25px;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #333;
        }

        /* 2. Estilos de la Sección de "Lo Más Vendido" */
        .bestsellers-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .bestsellers-section h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #111;
        }

        .bestsellers-section p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Contenedor del Carrusel Desplazable */
        .slider-container {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 15px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: #ccc transparent;
        }

        .slider-container::-webkit-scrollbar {
            height: 6px;
        }

        .slider-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        /* Tarjeta de Producto */
        .product-card {
            flex: 0 0 240px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            scroll-snap-align: start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .product-img-wrapper {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .product-card img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #222;
            line-height: 1.3;
        }

        .price {
            font-weight: 700;
            color: #000;
            font-size: 16px;
            margin-bottom: 15px;
            display: block;
        }

        .add-to-cart {
            background: #000;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            width: 100%;
            transition: background 0.2s;
        }

        .add-to-cart:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Encabezado con la Barra de Búsqueda -->
    <header>
        <div class="search-container">
            <form class="search-form" action="#" method="get">
                <input type="search" placeholder="Búsqueda de productos..." name="s" class="search-input" required />
                <button type="submit" class="search-btn">🔍</button>
            </form>
        </div>
    </header>

    <!-- Sección de Lo Más Vendido -->
    <section class="bestsellers-section">
        <h2>LOS MÁS VENDIDOS</h2>
        <p>Explora los perfumes más vendidos de nuestra tienda</p>
        
        <div class="slider-container">
            <!-- Producto 1 -->
            <div class="product-card">
                <div class="product-img-wrapper">
                    <!-- Reemplaza el src con el link de tu imagen -->
                    <img src="https://via.placeholder.com/150" alt="Club De Nuit Women">
                </div>
                <div>
                    <h3>Club De Nuit Women</h3>
                    <span class="price">C$1,665</span>
                </div>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Club de Nuit Iconic">
                </div>
                <div>
                    <h3>Club de Nuit Iconic</h3>
                    <span class="price">C$2,050</span>
                </div>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>

            <!-- Producto 3 -->
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Odyssey White Edition">
                </div>
                <div>
                    <h3>Odyssey White Edition</h3>
                    <span class="price">C$1,792</span>
                </div>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>

            <!-- Producto 4 -->
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Amber Oud Aqua Dubai">
                </div>
                <div>
                    <h3>Amber Oud Aqua Dubai</h3>
                    <span class="price">C$2,523</span>
                </div>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>

            <!-- Producto 5 -->
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://via.placeholder.com/150" alt="Yara Tous">
                </div>
                <div>
                    <h3>Yara Tous</h3>
                    <span class="price">C$1,665</span>
                </div>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>
        </div>
    </section>

</body>
</html>
